name: publish

# Publishes this MCP server to the official MCP Registry when a version tag is pushed.
#
# The registry entry (server.json) is metadata pointing at the PyPI package, and the registry
# proves ownership by finding the `mcp-name` marker inside that package's description — so the
# PyPI release has to exist before this runs.
#
# Uploading to PyPI is deliberately a local step (`uv publish dist/*`) so the API token stays in
# the maintainer's credential store instead of being copied into CI. Publishing to the registry
# needs no secret at all: GitHub OIDC is sufficient, which is what id-token: write enables.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Confirm the release is on PyPI and carries the ownership marker
        run: |
          IDENTIFIER=$(python -c "import json;print(json.load(open('server.json'))['packages'][0]['identifier'])")
          VERSION=$(python -c "import json;print(json.load(open('server.json'))['version'])")
          echo "checking ${IDENTIFIER} ${VERSION} on PyPI"
          code=000
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o pypi.json -w "%{http_code}" "https://pypi.org/pypi/${IDENTIFIER}/${VERSION}/json")
            if [ "$code" = "200" ]; then echo "found it on PyPI"; break; fi
            echo "PyPI returned $code (attempt ${attempt}/5); waiting for it to appear"
            sleep 15
          done
          if [ "$code" != "200" ]; then
            echo "::error::${IDENTIFIER} ${VERSION} is not on PyPI — upload it before tagging"
            exit 1
          fi
          grep -q "mcp-name: io.github.AbhijatSaxena/blink-camera-mcp" pypi.json \
            || { echo "::error::the PyPI description is missing the mcp-name ownership marker"; exit 1; }
          echo "ownership marker present"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
