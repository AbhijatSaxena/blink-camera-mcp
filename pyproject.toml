[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blink-camera-mcp"
version = "0.1.0"
description = "MCP server for Amazon Blink cameras: see, aim (pan/tilt) and capture, including the undocumented pan/tilt accessory protocol."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abhijat Saxena"}]
keywords = [
    "mcp",
    "model-context-protocol",
    "blink",
    "amazon-blink",
    "blink-camera",
    "camera",
    "pan-tilt",
    "ptz",
    "security-camera",
    "home-automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    "mcp>=2.2.0,<3",
    "blinkpy>=0.25.0",
    "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/AbhijatSaxena/blink-camera-mcp"
Issues = "https://github.com/AbhijatSaxena/blink-camera-mcp/issues"

[project.scripts]
blink-mcp = "blink_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["blink_mcp*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["C", "D", "E", "F", "I", "N", "PL", "Q", "UP", "W"]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # summary on the first line is fine
    "PLR0913",  # arguments are explicit here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
